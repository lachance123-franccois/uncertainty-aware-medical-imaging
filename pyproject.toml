[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "umi"
version = "0.1.0"
description = "Uncertainty quantification for medical image classification: MC Dropout vs Deep Ensembles vs Evidential Deep Learning"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "torch>=2.0",
    "numpy>=1.24",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
data = ["medmnist>=3.0", "torchvision>=0.15"]
dev = ["pytest>=7.4", "ruff>=0.5"]

[project.scripts]
umi = "umi.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E402", "B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
